<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="通勤バス" />
<meta name="theme-color" content="#f2f4f9" id="themeColorMeta" />
<title>つくば通勤バス</title>
<style>
  :root{
    --bg:#f2f4f9; --card:rgba(255,255,255,.88); --card-solid:#ffffff; --text:#10151f;
    --muted:#667085; --subtle:#8a93a3; --line:rgba(16,21,31,.10);
    --accent:#1677ff; --accent-weak:rgba(22,119,255,.12);
    --green:#13a05f; --orange:#ef8a00; --red:#e5484d;
    --track:#e9edf4; --kantetsu:#2563eb; --hokubu:#0891b2; --yoshinuma:#7c3aed;
    --material:rgba(255,255,255,.76);
    --shadow:0 1px 3px rgba(16,21,31,.05),0 10px 28px rgba(16,21,31,.06);
  }
  [data-theme="dark"]{
    --bg:#0b0e14; --card:rgba(22,27,36,.86); --card-solid:#161b24; --text:#eef2f8;
    --muted:#9aa6b6; --subtle:#6f7a8b; --line:rgba(238,242,248,.12);
    --accent:#5aa2ff; --accent-weak:rgba(90,162,255,.17);
    --green:#3ad28f; --orange:#ffb74d; --red:#ff6b70;
    --track:#222a36; --kantetsu:#6aa6ff; --hokubu:#2bc6e0; --yoshinuma:#a98bff;
    --material:rgba(22,27,36,.76);
    --shadow:0 1px 3px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .app{width:min(100%,540px);margin:0 auto;padding:0 14px 40px;}

  .nav{
    position:sticky;top:0;z-index:30;
    padding:8px 0 10px;
    background:linear-gradient(to bottom,var(--bg) 42%,rgba(242,244,249,.76) 82%,transparent);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  [data-theme="dark"] .nav{background:linear-gradient(to bottom,var(--bg) 42%,rgba(11,14,20,.76) 82%,transparent);}
  .title-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;margin-bottom:8px;}
  .title{font-size:17px;font-weight:850;text-align:center;letter-spacing:-.02em;padding:7px 0 0 40px;}
  .theme{display:flex;gap:4px;}
  .theme button{appearance:none;border:1px solid var(--line);background:var(--card-solid);color:var(--muted);
    width:30px;height:28px;border-radius:9px;font-size:12px;font-weight:800;cursor:pointer;line-height:1;padding:0;}
  .theme button.active{color:var(--accent);background:var(--accent-weak);border-color:transparent;}

  .clockwrap{margin:2px 2px 10px;}
  .clock{font-size:46px;line-height:.96;font-weight:850;letter-spacing:-.045em;}
  .clock .sec{font-size:20px;font-weight:800;color:var(--muted);margin-left:4px;letter-spacing:-.02em;}
  .date{margin-top:4px;color:var(--muted);font-size:12.5px;font-weight:700;}

  .seg{display:grid;gap:4px;padding:4px;background:rgba(128,128,128,.10);border:1px solid var(--line);border-radius:14px;margin-top:8px;}
  .seg.dir{grid-template-columns:1fr 1fr;}
  .seg.dia{grid-template-columns:repeat(4,1fr);}
  .seg button{appearance:none;border:0;background:transparent;color:var(--muted);font-weight:800;
    border-radius:10px;padding:10px 4px;font-size:12px;cursor:pointer;white-space:nowrap;line-height:1.1;}
  .seg button.active{background:var(--card-solid);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.10);}
  [data-theme="dark"] .seg button.active{box-shadow:0 2px 8px rgba(0,0,0,.42);}
  .note{margin:10px 4px 2px;color:var(--muted);font-size:11.5px;line-height:1.5;font-weight:600;}

  .stack{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .caption{margin:14px 4px 6px;color:var(--subtle);font-size:11.5px;font-weight:850;letter-spacing:.02em;}

  .card{border:1px solid var(--line);border-radius:22px;background:var(--material);box-shadow:var(--shadow);
    padding:14px;position:relative;overflow:hidden;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .rline{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .badge{font-size:11px;font-weight:850;color:#fff;border-radius:7px;padding:3px 7px;letter-spacing:.02em;flex:0 0 auto;}
  .b-kantetsu{background:var(--kantetsu);} .b-hokubu{background:var(--hokubu);} .b-yoshinuma{background:var(--yoshinuma);}
  .badge-link{text-decoration:none;}
  .station-link{color:var(--accent);text-decoration:none;font-weight:850;}

  .rlabel{font-size:17px;font-weight:850;letter-spacing:-.02em;line-height:1.2;white-space:normal;overflow-wrap:anywhere;}

  .ended{font-size:15px;font-weight:800;color:var(--muted);padding:8px 2px;}

  .mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
  .dep{min-width:0;}
  .dep .t{display:block;font-size:28px;font-weight:850;letter-spacing:-.05em;line-height:1;}
  .dep .u{font-size:12px;font-weight:800;color:var(--muted);margin-top:3px;}
  .center{text-align:center;min-width:82px;}
  .big{font-size:38px;line-height:.94;font-weight:900;letter-spacing:-.06em;}
  .big .min{font-size:15px;font-weight:850;margin-left:1px;letter-spacing:-.02em;}
  .big.soon{font-size:24px;letter-spacing:-.02em;}
  .clabel{margin-top:4px;font-size:11px;font-weight:800;color:var(--muted);}
  .arr{text-align:right;color:var(--text);min-width:0;}
  .arr .t{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em;}
  .arr .u{font-size:11px;color:var(--muted);font-weight:800;margin-top:3px;}
  .bar{height:6px;border-radius:999px;background:var(--track);margin-top:12px;overflow:hidden;}
  .fill{height:100%;border-radius:999px;width:0;transition:width .35s linear;}
  .fill.ok{background:var(--green);} .fill.soon{background:var(--accent);}
  .fill.run{background:var(--orange);} .fill.risk{background:var(--red);}
  .status{margin-top:10px;font-size:13px;line-height:1.45;font-weight:700;}
  .status.ok{color:var(--green);} .status.soon{color:var(--accent);}
  .status.run{color:var(--orange);} .status.risk{color:var(--red);}
  .status.ended{color:var(--muted);}
  .uplist{border:1px solid var(--line);border-radius:16px;background:var(--material);overflow:hidden;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .up{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);}
  .up:first-child{border-top:0;}
  .up .route-small{font-size:11px;color:var(--muted);font-weight:700;line-height:1.2;white-space:normal;overflow-wrap:anywhere;}
  .up .ut{font-size:17px;font-weight:850;letter-spacing:-.02em;}
  .up .um{font-size:14px;font-weight:800;text-align:right;}
  .up .ua{color:var(--subtle);font-size:12px;font-weight:700;text-align:right;margin-top:2px;}
  .empty{font-size:14px;font-weight:700;color:var(--muted);padding:14px;background:var(--material);border-radius:16px;border:1px solid var(--line);}

  .links-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
  .linkbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;
    color:var(--text);background:var(--material);border:1px solid var(--line);border-radius:14px;
    padding:10px 12px;box-shadow:var(--shadow);font-size:14px;font-weight:750;}
  .linkbtn .arrow{font-size:12px;color:var(--muted);font-weight:900;}
  .foot{margin:18px 4px 0;color:var(--subtle);font-size:11px;line-height:1.6;font-weight:600;}

  @media(max-width:360px){
    .app{padding-left:10px;padding-right:10px;}
    .clock{font-size:42px;}
    .rlabel{font-size:15px;}
    .dep .t{font-size:25px;}
    .big{font-size:34px;}
    .arr .t{font-size:17px;}
    .links-grid{grid-template-columns:1fr;}
  }

  .rline{align-items:flex-start}.rlabel{font-size:16px;min-width:0;line-height:1.4}
  .route-detail{font-size:11px;color:var(--muted);margin:-4px 0 12px;line-height:1.5}
  .source-link{display:inline-block;margin-top:10px;color:var(--accent);font-size:11px;text-decoration:none;padding:3px 0}
  .stop-labels{display:flex;justify-content:space-between;gap:24px;margin-top:6px;font-size:11px;color:var(--muted);line-height:1.4}
  .stop-labels span{max-width:46%;min-width:0;overflow-wrap:anywhere}.stop-labels span:last-child{text-align:right}
  .next-day{font-size:23px;line-height:1.2;letter-spacing:0}.day-tag{font-size:12px;color:var(--accent);margin:0 0 10px;font-weight:800}
  .up>div{min-width:0}.ut small{font-size:10px;letter-spacing:0}.up .route-small{line-height:1.5}
  .alert{border:1px solid var(--line);border-radius:14px;background:var(--card-solid);margin-top:12px;padding:12px;font-size:12px;line-height:1.6}
  .alert p{margin:0 0 8px}.alert a{color:var(--accent)}[hidden]{display:none!important}
  button.retry{font:inherit;background:var(--accent-weak);color:var(--accent);border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
  details.walk-settings{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px;background:var(--material);font-size:12px;color:var(--muted)}
  summary{cursor:pointer;padding:3px 0}details.walk-settings p{line-height:1.6;margin:10px 0}
  .walk-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;line-height:1.5}
  .walk-row input{width:58px;font:inherit;color:var(--text);background:var(--card-solid);border:1px solid var(--line);border-radius:6px;padding:6px}
  .walk-row label{min-width:0}.walk-row span{flex:0 0 auto}.foot a{color:var(--accent)}.foot details{margin-top:8px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="nav">
    <div class="title-row">
      <div class="title">つくば通勤バス</div>
      <div class="theme" id="themePills">
        <button data-theme="auto" title="自動">A</button>
        <button data-theme="light" title="ライト">☀</button>
        <button data-theme="dark" title="ダーク">☾</button>
      </div>
    </div>
    <div class="clockwrap">
      <div class="clock"><span id="clockMain">--:--</span><span class="sec" id="clockSec">--</span></div>
      <div class="date" id="dateEl">--</div>
    </div>
    <div class="seg dir" id="dirSeg">
      <button data-dir="outbound">行き</button>
      <button data-dir="inbound">帰り</button>
    </div>
    <div class="seg dia" id="diaSeg">
      <button data-dia="auto">自動</button>
      <button data-dia="weekday">平日</button>
      <button data-dia="saturday">土曜日</button>
      <button data-dia="holiday">日祝</button>
    </div>
    <div class="note" id="noteEl"></div>
  </header>

  <main>
    <div class="alert" id="dataStatus" role="status"><p>公式時刻表を読み込み中です。</p><button class="retry" id="retryData">再読み込み</button></div>
    <div class="alert" id="serviceNotice" hidden></div>
    <section class="stack" id="cards"></section>

    <section class="caption">このあとの便</section>
    <section id="upcoming"></section>

    <section class="caption">リンク</section>
    <nav class="links-grid" id="links"></nav>

    <details class="walk-settings" id="walkSettings">
      <summary>徒歩時間を調整</summary>
      <p>帰りは建築研究所からの出発を想定しています。徒歩は目安です。普段の出発場所に合わせて変更してください。</p>
      <div class="walk-row"><label for="walk-station">行き：駅からバス停</label><span><input id="walk-station" data-walk="station" type="number" min="0" max="60" step="1" value="5"> 分</span></div>
      <div class="walk-row"><label for="walk-nits">帰り：教職員支援機構バス停まで</label><span><input id="walk-nits" data-walk="nits" type="number" min="0" max="60" step="1" value="5"> 分</span></div>
      <div class="walk-row"><label for="walk-oho">帰り：大穂窓口センターまで</label><span><input id="walk-oho" data-walk="oho" type="number" min="0" max="60" step="1" value="15"> 分</span></div>
      <div class="walk-row"><label for="walk-bri">帰り：建築研究所バス停まで</label><span><input id="walk-bri" data-walk="bri" type="number" min="0" max="60" step="1" value="0"> 分</span></div>
    </details>
    <footer class="foot" id="sourceInfo">公式時刻表を確認中です。</footer>
  </main>
</div>

<script>
"use strict";
let DATA = null, ROUTES = [];
let dataMode = 'loading', dataError = '', lastMinute = '';
const WD = ['日','月','火','水','木','金','土'];
const BADGE_TEXT = {kantetsu:'関鉄',hokubu:'H 北部',yoshinuma:'Y 吉沼'};
const STORE_KEY = 'kenken_bus_html_swift_like_v1';
const CACHE_KEY = 'tsukuba_bus_official_data_v1';
const state = {direction:'outbound',scheduleKind:'auto',themeMode:'auto',walks:{station:5,nits:5,oho:15,bri:0}};
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function esc(v){ return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeURL(v){ if(typeof v!=='string' || !/^https?:\/\//i.test(v))throw new Error('リンクの形式が不正です'); return v; }
function validateData(d){
  if(!d || d.schemaVersion!==1 || !Array.isArray(d.routes) || !d.routes.length || !d.calendar || !d.calendar.holidays || !/^\d{4}-\d{2}-\d{2}$/.test(d.checkedAt))throw new Error('時刻表データの形式が不正です');
  if(!Number.isInteger(d.calendar.startYear) || !Number.isInteger(d.calendar.endYear) || d.calendar.endYear<d.calendar.startYear || !Array.isArray(d.calendar.provisionalYears))throw new Error('カレンダーの形式が不正です');
  for(const [date,name] of Object.entries(d.calendar.holidays))if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || typeof name!=='string')throw new Error('祝日データの形式が不正です');
  function entries(list){
    if(!Array.isArray(list))throw new Error('便の一覧がありません');
    let previous='';
    for(const t of list){
      if(!t || !/^([01]\d|2[0-3]):[0-5]\d$/.test(t.departure) || !/^([01]\d|2[0-3]):[0-5]\d$/.test(t.arrival) || t.arrival<t.departure || (previous && previous>=t.departure))throw new Error('発着時刻または並び順が不正です');
      previous=t.departure;
    }
  }
  const ids=new Set();
  for(const r of d.routes){
    if(!r || typeof r.id!=='string' || !/^[a-z0-9-]+$/.test(r.id) || ids.has(r.id) || !['outbound','inbound'].includes(r.direction) || !['kantetsu','hokubu','yoshinuma'].includes(r.badge) || !['bri','shimotsuma','tsukubus'].includes(r.calendar) || !r.fromStop || !r.toStop || typeof r.label!=='string' || !['tsukuba','kenkyu',null].includes(r.trainArrival))throw new Error('路線データの形式が不正です');
    ids.add(r.id);safeURL(r.sourceUrl);safeURL(r.realtimeUrl);
    for(const kind of ['weekday','saturday','holiday'])entries(r[kind]);
    if(!r.dateOverrides || typeof r.dateOverrides!=='object' || Array.isArray(r.dateOverrides))throw new Error('特別ダイヤの形式が不正です');
    for(const [date,o] of Object.entries(r.dateOverrides)){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || !o || (!Array.isArray(o.entries) && !['weekday','saturday','holiday'].includes(o.kind)))throw new Error('特別ダイヤの形式が不正です');
      if(o.entries)entries(o.entries);
    }
  }
  if(!Array.isArray(d.sources) || !Array.isArray(d.notices))throw new Error('確認資料の形式が不正です');
  for(const s of d.sources){if(!s.label)throw new Error('資料名がありません');safeURL(s.url);}
  for(const n of d.notices){if(!/^\d{4}-\d{2}-\d{2}$/.test(n.start) || !/^\d{4}-\d{2}-\d{2}$/.test(n.end) || n.end<n.start || !Array.isArray(n.badges) || typeof n.text!=='string')throw new Error('運行情報の形式が不正です');safeURL(n.url);}
  return d;
}
function installData(d){ DATA=validateData(d);ROUTES=DATA.routes; }
function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
    if(['outbound','inbound'].includes(s.direction))state.direction=s.direction;
    if(s.scheduleKind==='weekend')s.scheduleKind='holiday';
    if(['auto','weekday','saturday','holiday'].includes(s.scheduleKind))state.scheduleKind=s.scheduleKind;
    if(['auto','light','dark'].includes(s.themeMode))state.themeMode=s.themeMode;
    for(const k of Object.keys(state.walks))if(s.walks && Number.isInteger(s.walks[k]) && s.walks[k]>=0 && s.walks[k]<=60)state.walks[k]=s.walks[k];
  }catch(e){}
}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
function isWeekendOrHoliday(date){return date.getDay()===0 || date.getDay()===6 || !!(DATA && DATA.calendar.holidays[ymd(date)]);}
function isHoliday(date){return date.getDay()===0 || !!(DATA && DATA.calendar.holidays[ymd(date)]);}
function yearEnd(date){const m=date.getMonth()+1,d=date.getDate();return (m===12 && d>=29)||(m===1 && d<=3);}
function scheduleInfo(route,kind,date){
  if(!DATA)return {entries:[],uncertain:true,reason:'時刻表を読み込み中です。'};
  const day=ymd(date),year=date.getFullYear();
  const override=route.dateOverrides[day];
  if(override)return {entries:override.entries || route[override.kind],kind:override.kind || 'special',reason:override.note || '特別ダイヤ'};
  if(year<DATA.calendar.startYear || year>DATA.calendar.endYear)return {entries:[],uncertain:true,reason:'この年の祝日・運行日を確認できません。公式時刻表をご確認ください。'};
  if(route.calendar==='shimotsuma' && date.getMonth()===0 && date.getDate()<=3)return {entries:[],uncertain:true,reason:'正月特別ダイヤは未確認です。公式時刻表をご確認ください。'};
  if(route.calendar==='bri' && yearEnd(date))return {entries:[],uncertain:true,reason:'建築研究所線の年末年始ダイヤは未確認です。公式情報をご確認ください。'};
  let resolved;
  if(kind==='weekend')kind='holiday';
  if(['weekday','saturday','holiday'].includes(kind))resolved=kind;
  else if(route.calendar==='tsukubus' && yearEnd(date))resolved='holiday';
  else if(isHoliday(date))resolved='holiday';
  else if(date.getDay()===6)resolved='saturday';
  else if(route.calendar==='shimotsuma' && ((date.getMonth()===7 && date.getDate()>=13 && date.getDate()<=16)||(date.getMonth()===11 && date.getDate()>=29)))resolved='saturday';
  else resolved='weekday';
  return {entries:route[resolved],kind:resolved,uncertain:false};
}
function scheduleFor(route,kind,date){return scheduleInfo(route,kind,date).entries;}
function normalizeTime(t){return typeof t==='string'?{departure:t,arrival:null}:Array.isArray(t)?{departure:t[0],arrival:t[1]}:t;}
function makeDate(hm,date){const d=new Date(date);const [h,m]=hm.split(':').map(Number);d.setHours(h,m,0,0);return d;}
function walkFor(route){if(route.direction==='outbound')return state.walks.station;if(route.fromStop==='大穂窓口センター')return state.walks.oho;if(route.fromStop==='教職員支援機構')return state.walks.nits;return state.walks.bri;}
function routeBuses(route,now,limit=8){
  const buses=[];
  for(let offset=0;offset<15;offset++){
    const date=new Date(now);date.setHours(0,0,0,0);date.setDate(date.getDate()+offset);
    const info=scheduleInfo(route,offset===0?state.scheduleKind:'auto',date);
    if(info.uncertain)return {buses,blocked:info};
    for(const raw of info.entries){
      const time=normalizeTime(raw),departureDate=makeDate(time.departure,date);
      if(departureDate<=now)continue;
      const arrivalDate=makeDate(time.arrival,date),walk=walkFor(route);
      const minutesUntilDeparture=Math.ceil((departureDate-now)/60000);
      buses.push({route,time,departureDate,arrivalDate,arrivalText:time.arrival,minutesUntilDeparture,minutesUntilLeaving:minutesUntilDeparture-walk,walk,offset,kind:info.kind});
      if(buses.length>=limit)return {buses,blocked:null};
    }
  }
  return {buses,blocked:null};
}
function nextBus(route,now){return routeBuses(route,now,1).buses[0] || null;}
function routesFor(direction){return ROUTES.filter(r=>r.direction===direction);}
function dayLabel(date,now){const d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()+1);const prefix=ymd(date)===ymd(d)?'明日 ':'';return prefix+(date.getMonth()+1)+'/'+date.getDate()+'（'+WD[date.getDay()]+'）';}
function statusFor(bus){
  if(bus.offset>0)return ['ended','次の運行日：'+dayLabel(bus.departureDate,new Date())];
  const n=bus.minutesUntilLeaving;
  if(n>15)return ['ok','出発まで余裕があります。'];
  if(n>5)return ['soon','そろそろ出発の準備を。'];
  if(n>=0)return ['run',bus.walk?'徒歩目安では、まもなく出発する時間です。':'まもなく発車します。'];
  return ['risk','徒歩目安では出発時刻を過ぎています。次便も確認してください。'];
}
function makeCardViewModel(route,now){
  const result=routeBuses(route,now,1),bus=result.buses[0];
  if(!bus)return {route,nextBus:null,blocked:result.blocked,statusText:result.blocked?result.blocked.reason:'この先の運行を確認できません。公式時刻表をご確認ください。'};
  const today=scheduleInfo(route,state.scheduleKind,now);
  let [urgencyLevel,statusText]=statusFor(bus);
  if(bus.offset>0)statusText=(today.entries.length?'本日の運行は終了しました。':'本日は運休です。')+' 次は'+dayLabel(bus.departureDate,now)+' '+bus.time.departure+'発。';
  else if(bus.walk)statusText+=' 徒歩目安'+bus.walk+'分。';
  return {route,nextBus:bus,urgencyLevel,statusText,heroMinutes:bus.minutesUntilLeaving,heroLabel:bus.walk?'出発まで':'発車まで'};
}
function makeCardViewModels(direction,now){return routesFor(direction).map(r=>makeCardViewModel(r,now)).sort((a,b)=>(a.nextBus?a.nextBus.offset:100)-(b.nextBus?b.nextBus.offset:100));}
function txTarget(date){return isWeekendOrHoliday(date)?'holiday':'weekday';}
function txURL(station,date){return 'https://transfer-train.navitime.biz/tx/timetable?station='+station+'&line=1&target='+txTarget(date)+'&direction=0';}
function badgeHTML(route){return '<a class="badge b-'+route.badge+' badge-link" href="'+esc(route.realtimeUrl)+'" target="_blank" rel="noopener">'+BADGE_TEXT[route.badge]+'</a>';}
function stationLink(route,date){if(!route.trainArrival)return esc(route.toStop);const code=route.trainArrival==='tsukuba'?'9438':'9441';return '<a class="station-link" href="'+esc(txURL(code,date))+'" target="_blank" rel="noopener">'+esc(route.toStop)+'</a>';}
function cardHTML(card,now){
  const r=card.route,b=card.nextBus;
  const head='<div class="rline">'+badgeHTML(r)+'<span class="rlabel">'+esc(r.label)+'</span></div>';
  const detail=r.platform?'<div class="route-detail">'+esc(r.platform)+'</div>':'';
  const source='<a class="source-link" href="'+esc(r.sourceUrl)+'" target="_blank" rel="noopener">公式時刻表 ↗</a>';
  if(!b)return '<article class="card uncertain">'+head+detail+'<div class="ended">'+esc(card.statusText)+'</div>'+source+'</article>';
  const hero=b.offset>0?'<div class="big next-day">'+(dayLabel(b.departureDate,now).startsWith('明日')?'明日':'次の運行日')+'</div>':card.heroMinutes>0?'<div class="big">'+card.heroMinutes+'<span class="min">分</span></div>':'<div class="big soon">まもなく</div>';
  return '<article class="card" data-route="'+r.id+'">'+head+detail+(b.offset>0?'<div class="day-tag">'+esc(dayLabel(b.departureDate,now))+'</div>':'')+
    '<div class="mid"><div class="dep"><span class="t">'+b.time.departure+'</span><div class="u">発</div></div><div class="center">'+hero+'<div class="clabel">'+(b.offset>0?'始発':card.heroLabel)+'</div></div><div class="arr"><span class="t">'+b.arrivalText+'</span><div class="u">着予定</div></div></div>'+
    '<div class="stop-labels"><span>'+esc(r.fromStop)+'</span><span>'+stationLink(r,b.arrivalDate)+'</span></div>'+
    (b.offset===0?'<div class="bar"><div class="fill '+card.urgencyLevel+'" style="width:'+Math.min(Math.max(card.heroMinutes/30,0),1)*100+'%"></div></div>':'')+
    '<div class="status '+card.urgencyLevel+'">'+esc(card.statusText)+'</div>'+source+'</article>';
}
function upcomingRowHTML(b,now){return '<div class="up">'+badgeHTML(b.route)+'<div><div class="route-small">'+esc(b.route.label)+'</div><div class="ut">'+b.time.departure+(b.offset>0?' <small>'+esc(dayLabel(b.departureDate,now))+'</small>':'')+'</div></div><div><div class="um">'+(b.offset>0?'次の運行日':b.minutesUntilDeparture+'分後')+'</div><div class="ua">'+b.arrivalText+'着予定</div></div></div>';}
function linkHTML(title,url){return '<a class="linkbtn" href="'+esc(url)+'" target="_blank" rel="noopener"><span>'+esc(title)+'</span><span class="arrow">↗</span></a>';}
function renderCards(now){
  const selected=routesFor(state.direction);
  document.getElementById('cards').innerHTML=makeCardViewModels(state.direction,now).map(c=>cardHTML(c,now)).join('');
  const upcoming=selected.flatMap(r=>routeBuses(r,now,8).buses.slice(1)).sort((a,b)=>a.departureDate-b.departureDate).slice(0,7);
  document.getElementById('upcoming').innerHTML=upcoming.length?'<div class="uplist">'+upcoming.map(b=>upcomingRowHTML(b,now)).join('')+'</div>':'<div class="empty">このあとの便は確認できません。公式時刻表をご確認ください。</div>';
}
function renderClock(now){
  document.getElementById('clockMain').textContent=pad(now.getHours())+':'+pad(now.getMinutes());document.getElementById('clockSec').textContent=pad(now.getSeconds());
  const holiday=DATA && DATA.calendar.holidays[ymd(now)];
  document.getElementById('dateEl').textContent=(now.getMonth()+1)+'/'+now.getDate()+'（'+WD[now.getDay()]+'）'+(holiday?' '+holiday:'');
}
function renderControls(){
  for(const [id,attribute,key] of [['dirSeg','dir','direction'],['diaSeg','dia','scheduleKind'],['themePills','theme','themeMode']]){
    document.querySelectorAll('#'+id+' button').forEach(b=>{const active=b.dataset[attribute]===state[key];b.classList.toggle('active',active);b.setAttribute('aria-pressed',active);});
  }
}
function renderNote(now){
  const names={auto:'自動判定',weekday:'平日',saturday:'土曜日',holiday:'日曜・祝日'};
  document.getElementById('noteEl').textContent=state.scheduleKind==='auto'?'路線ごとに曜日・祝日・特別運行日を判定しています。':'手動：今日を「'+names[state.scheduleKind]+'」として表示。翌日以降は自動判定します。';
  const messages=[];
  if(dataMode==='cache')messages.push('更新データを取得できなかったため、前回保存した時刻表を表示しています。'+(DATA?' 確認日：'+DATA.checkedAt:'')+'。公式時刻表もご確認ください。');
  if(!DATA)messages.push(dataMode==='error'?'時刻表を読み込めません。HTMLとJSONを同じフォルダに置いてGitHub Pagesで公開してください。':'公式時刻表を読み込み中です。');
  if(DATA){
    if(DATA.calendar.provisionalYears.includes(now.getFullYear()))messages.push('この年の祝日は見込みです。正式発表後に更新が必要です。');
    if(yearEnd(now))messages.push('つくバスは12/29〜1/3が休日ダイヤ。関鉄は路線ごとに年末年始の扱いが異なります。');
  }
  const box=document.getElementById('dataStatus');box.hidden=!messages.length;box.querySelector('p').textContent=messages.join(' ');
  const notices=DATA?DATA.notices.filter(n=>ymd(now)>=n.start && ymd(now)<=n.end && routesFor(state.direction).some(r=>n.badges.includes(r.badge))):[];
  const el=document.getElementById('serviceNotice');el.hidden=!notices.length;el.innerHTML=notices.map(n=>'<a href="'+esc(n.url)+'" target="_blank" rel="noopener">'+esc(n.text)+' ↗</a>').join('<br>');
}
function renderLinks(now){
  const links=[['関鉄接近','https://navi.kanto-tetsudo.com/'],['つくバス運行情報','https://www.city.tsukuba.lg.jp/kurashi/kotsu/bus/14301.html']];
  if(state.direction==='inbound')links.push(['つくば駅 TX',txURL('9438',now)],['研究学園駅 TX',txURL('9441',now)]);
  document.getElementById('links').innerHTML=links.map(x=>linkHTML(...x)).join('');
  const el=document.getElementById('sourceInfo');
  el.innerHTML=DATA?esc(DATA.timetableLabel)+'<br>到着は時刻表上の予定です。遅延は接近情報をご確認ください。<details><summary>確認資料</summary>'+DATA.sources.map(s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+' ↗</a>').join('<br>')+'</details>':'<a href="https://www.city.tsukuba.lg.jp/kurashi/kotsu/bus/1001471.html" target="_blank" rel="noopener">つくバス公式時刻表 ↗</a><br><a href="https://www.kantetsu.co.jp/bus/timetable/tsukuba" target="_blank" rel="noopener">関鉄公式時刻表 ↗</a>';
}
function renderAll(now=new Date()){
  renderClock(now);renderControls();renderNote(now);renderLinks(now);
  if(DATA)renderCards(now);else {document.getElementById('cards').innerHTML='<div class="empty">'+(dataMode==='error'?'時刻表データがありません。公式リンクをご利用ください。':'時刻表を読み込み中…')+'</div>';document.getElementById('upcoming').innerHTML='';}
  lastMinute=ymd(now)+' '+now.getHours()+':'+now.getMinutes();
}
function tick(){const now=new Date(),minute=ymd(now)+' '+now.getHours()+':'+now.getMinutes();if(minute!==lastMinute)renderAll(now);else renderClock(now);}
async function loadData(){
  document.getElementById('retryData').disabled=true;
  try{
    const response=await fetch(new URL('tsukuba-bus-data.json',document.baseURI),{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const d=await response.json();installData(d);dataMode='fresh';dataError='';
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(d));}catch(e){}
  }catch(e){
    dataError=String(e.message);
    try{installData(JSON.parse(localStorage.getItem(CACHE_KEY)||'null'));dataMode='cache';}catch(cacheError){DATA=null;ROUTES=[];dataMode='error';}
  }
  document.getElementById('retryData').disabled=false;renderAll();
}
const mq = window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):{matches:false};
function applyTheme(){const t=state.themeMode==='auto'?(mq.matches?'dark':'light'):state.themeMode;document.documentElement.dataset.theme=t;document.getElementById('themeColorMeta').setAttribute('content',t==='dark'?'#0b0e14':'#f2f4f9');}
document.getElementById('dirSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.direction=b.dataset.dir;saveState();renderAll();});
document.getElementById('diaSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.scheduleKind=b.dataset.dia;saveState();renderAll();});
document.getElementById('themePills').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.themeMode=b.dataset.theme;saveState();applyTheme();renderControls();});
document.getElementById('walkSettings').addEventListener('change',e=>{const input=e.target.closest('input[data-walk]');if(!input)return;let v=Number(input.value);v=Number.isFinite(v)?Math.max(0,Math.min(60,Math.round(v))):state.walks[input.dataset.walk];state.walks[input.dataset.walk]=v;input.value=v;saveState();renderAll();});
document.getElementById('retryData').addEventListener('click',loadData);
if(mq.addEventListener)mq.addEventListener('change',()=>{if(state.themeMode==='auto')applyTheme();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderAll();});
loadState();applyTheme();renderAll();
document.querySelectorAll('input[data-walk]').forEach(i=>i.value=state.walks[i.dataset.walk]);
loadData();setInterval(tick,1000);

</script>
</body>
</html>
