<script id="ac-theme">
(() => {
  const key = 'ac-tools-theme-v1';
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  const valid = value => ['auto', 'light', 'dark', 'black'].includes(value);
  let mode = 'auto';
  try {
    const saved = localStorage.getItem(key);
    if (valid(saved)) mode = saved;
  } catch { /* Storage can be unavailable for a local file. */ }

  function apply() {
    const theme = mode === 'auto' ? (system.matches ? 'dark' : 'light') : (mode === 'black' ? 'dark' : mode);
    const changed = document.documentElement.dataset.theme !== theme;
    document.documentElement.dataset.theme = theme;
    for (const button of document.querySelectorAll('.ac-modes button')) {
      button.setAttribute('aria-pressed', String(button.dataset.acMode === (mode === 'black' ? 'dark' : mode)));
    }
    if (changed) window.dispatchEvent(new Event('ac-theme-change'));
  }

  apply();
  document.addEventListener('DOMContentLoaded', apply, { once: true });
  document.addEventListener('click', event => {
    const button = event.target.closest('.ac-modes button');
    if (!button) return;
    mode = button.dataset.acMode;
    try { localStorage.setItem(key, mode); } catch { /* Keep this tab's selection. */ }
    apply();
  });
  system.addEventListener('change', () => { if (mode === 'auto') apply(); });
  window.addEventListener('storage', event => {
    if (event.key === key || event.key === null) {
      mode = valid(event.newValue) ? event.newValue : 'auto';
      apply();
    }
  });
})();
</script>
<style id="ac-tokens">
/* Shared appearance for the standalone acoustic tools. */
:root {
  --ac-font: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
  --ac-mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  --ac-space-1: 4px;
  --ac-space-2: 8px;
  --ac-space-3: 12px;
  --ac-space-4: 16px;
  --ac-space-5: 24px;
  --ac-radius: 8px;
}
:root, :root[data-theme="light"] {
  color-scheme: light;
  --ac-bg: #f4f7f7; --ac-surface: #ffffff; --ac-surface-alt: #e8eff0;
  --ac-text: #182b32; --ac-muted: #475c64; --ac-border: #71858c;
  --ac-primary: #135b70; --ac-primary-hover: #0c485a; --ac-on-primary: #ffffff;
  --ac-link: #105c76; --ac-focus: #036b88;
  --ac-danger: #9c343c; --ac-success: #216341; --ac-warning: #795205;
  --ac-backdrop: rgb(11 21 26 / 58%);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ac-bg: #111a1e; --ac-surface: #19252a; --ac-surface-alt: #233238;
  --ac-text: #eef5f6; --ac-muted: #b5c7cc; --ac-border: #647b83;
  --ac-primary: #83d5e6; --ac-primary-hover: #a7e5f0; --ac-on-primary: #082731;
  --ac-link: #91ddef; --ac-focus: #8ae3fb;
  --ac-danger: #ff9ca3; --ac-success: #8bdfad; --ac-warning: #f1ce83;
  --ac-backdrop: rgb(3 9 12 / 72%);
}
:where(body) { color: var(--ac-text); background: var(--ac-bg); font-family: var(--ac-font); }
:where(h1, h2, h3, h4) { font-family: var(--ac-font); line-height: 1.35; }
:where(a) { color: var(--ac-link); }
:where(code, pre, kbd, samp) { font-family: var(--ac-mono); }
:where(.card) {
  padding: var(--ac-space-4); border: 1px solid var(--ac-border);
  border-radius: var(--ac-radius); background: var(--ac-surface);
}
:where(th, td) { padding: var(--ac-space-2); border-color: var(--ac-border); }
:where(th) { color: var(--ac-text); background: var(--ac-surface-alt); }
:where(button, .btn) {
  font-family: var(--ac-font); font-size: .9375rem; line-height: 1.35;
  min-height: 36px; padding: var(--ac-space-2) var(--ac-space-3);
  color: var(--ac-text); background: var(--ac-surface);
  border: 1px solid var(--ac-border); border-radius: var(--ac-radius); cursor: pointer;
}
:where(button.primary, .btn-primary) { background: var(--ac-primary); color: var(--ac-on-primary); }
:where(button:disabled) { cursor: default; }
:where(select, textarea, input:not([type]), input:is([type="text"], [type="number"], [type="url"], [type="search"], [type="file"])) {
  color: var(--ac-text); background: var(--ac-surface); font-family: var(--ac-font);
  border: 1px solid var(--ac-border); border-radius: var(--ac-radius);
  padding: var(--ac-space-1) var(--ac-space-2);
}
:where(input, select) { accent-color: var(--ac-primary); }
</style>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SlabFDTD — Peaks↔Mode 同定・安定版</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--bg:var(--ac-bg);--card:var(--ac-surface);--ink:var(--ac-text);--muted:var(--ac-muted);--accent:var(--ac-primary)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ac-font)}
.wrap{max-width:1200px;margin:14px auto;padding:12px}
.grid{display:grid;grid-template-columns:360px 1fr;gap:12px;align-items:start}
.card{background:var(--card);padding:12px;border-radius:var(--ac-radius);border:1px solid var(--ac-border)}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
input,select,button{width:100%;padding:8px;border-radius:var(--ac-radius);border:1px solid var(--ac-border);margin-bottom:8px}
.row{margin-bottom:8px}
.btn{background:var(--accent);color:var(--ac-on-primary);border:none;cursor:pointer;padding:8px;border-radius:var(--ac-radius)}
.small-btn{padding:6px;border-radius:var(--ac-radius);font-size:13px}
.inline{display:flex;gap:8px;align-items:center}
.controls-row{display:flex;gap:8px}
.mode-list{max-height:180px;overflow:auto;padding:6px;border-radius:var(--ac-radius);background:var(--ac-surface-alt);border:1px solid var(--ac-border)}
.progress{height:10px;background:var(--ac-surface-alt);border-radius:var(--ac-radius);overflow:hidden}
.progress>div{height:100%;background:var(--ac-primary);width:0%}
.tabbar{display:flex;gap:8px;margin-bottom:8px}
.tab{padding:8px;border-radius:var(--ac-radius);background:var(--ac-surface);border:1px solid var(--ac-border);cursor:pointer}
.tab.active{background:var(--accent);color:var(--ac-on-primary)}
.kv{font-size:13px;color:var(--ac-muted)}
canvas.heat,canvas.modeCanvas{border-radius:var(--ac-radius);border:1px solid var(--ac-border);touch-action:none;display:block;width:100%}
/* The FFT image already contains a raster label. Cover that label in place
   so it remains readable even over the darkest cells of the heatmap. */
.mode-image { position: relative; }
.mode-map-label {
  display: none; position: absolute; inset: 1px auto auto 8px; pointer-events: none;
  padding: 0 5px; font: 500 12px/18px var(--ac-font);
  background: var(--ac-surface); color: var(--ac-text); border-radius: 3px;
}
#modePanel:has(#modeStart:disabled) .mode-map-label { display: block; }

#frfPlot{height:360px}
.badge{display:inline-block;padding:2px 6px;border-radius:var(--ac-radius);background:var(--ac-surface-alt);border:1px solid var(--ac-border);color:var(--ac-text);font-size:12px;margin-right:6px}
#errorBox{color:var(--ac-danger);background:var(--ac-surface-alt);border:1px solid var(--ac-danger);padding:8px;border-radius:var(--ac-radius);margin-top:8px;display:none}

.btn:hover { background: var(--ac-primary-hover); }
#abortBtn, #resetBtn, #modeStop { color: var(--ac-text); background: var(--ac-surface-alt); border: 1px solid var(--ac-border); }
#modeList > div { border-bottom-color: var(--ac-border) !important; }
#modeList > div[style*="background"] { background: var(--ac-primary) !important; color: var(--ac-on-primary); }

  .js-plotly-plot .svg-container > svg.main-svg:first-of-type { background: var(--ac-surface) !important; }
  .js-plotly-plot :is(.bglayer rect.bg, .legend rect.bg) { fill: var(--ac-surface) !important; }
  .js-plotly-plot :is(.cartesianlayer, .infolayer) text {
    fill: var(--ac-text) !important; font-family: var(--ac-font) !important;
  }
  .js-plotly-plot :is(.gridlayer path, .zerolinelayer path) { stroke: var(--ac-border) !important; }
  .js-plotly-plot .hovertext :is(path, rect) { fill: var(--ac-text) !important; }
  .js-plotly-plot .hovertext text { fill: var(--ac-surface) !important; }
  .js-plotly-plot .modebar-group { background: var(--ac-surface) !important; }
  .js-plotly-plot .modebar-btn path { fill: var(--ac-muted) !important; }
</style>
<style>
html:has(#sample-gate[open]), body:has(#sample-gate[open]) { overflow: hidden; }
#sample-gate {
  box-sizing: border-box; width: min(28rem, calc(100% - 2rem)); max-height: calc(100% - 2rem);
  margin: auto; padding: 20px; overflow: auto; overscroll-behavior: contain;

}
#sample-gate::backdrop { background: rgba(0, 0, 0, .6); }
#sample-gate p { margin: 0 0 16px; font-size: inherit; }
#sample-gate form { margin: 0; text-align: right; }
#sample-gate button {
  min-width: 64px; min-height: 44px; padding: 6px 16px; border: 0; border-radius: 6px;
  background: var(--accent); color: #fff; font: inherit; cursor: pointer;
}
</style>
<style id="ac-components">
/* Keep shared controls legible alongside each tool's own component rules. */
html :is(input:not([type="range"], [type="checkbox"], [type="radio"], [type="hidden"], [type="color"]), select, textarea) {
  font-size: max(16px, 1em);
}
html ::placeholder { color: var(--ac-muted); opacity: 1; }
html :is(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 3px solid var(--ac-focus); outline-offset: 2px;
}
.ac-header {
  box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center;
  gap: var(--ac-space-2) var(--ac-space-4); min-height: 56px; height: auto;
  padding: var(--ac-space-2) var(--ac-space-4);
  border-bottom: 1px solid var(--ac-border); background: var(--ac-surface); color: var(--ac-text);
}
.ac-header :is(h1, .ac-title) {
  margin: 0; color: var(--ac-text); font: 700 clamp(1.125rem, 1.6vw, 1.4rem)/1.35 var(--ac-font);
  letter-spacing: normal; white-space: normal;
}
.ac-header .ac-actions {
  display: flex; align-items: center; flex-wrap: wrap; gap: var(--ac-space-3);
  margin-inline-start: auto; font: 500 14px/1.4 var(--ac-font); white-space: nowrap;
}
.ac-header .ac-home { color: var(--ac-link); font: inherit; text-decoration: underline; text-underline-offset: .2em; }
.ac-header .ac-modes {
  display: inline-flex; align-items: stretch; gap: 0; padding: 2px;
  background: var(--ac-surface-alt); border: 1px solid var(--ac-border); border-radius: var(--ac-radius);
}
.ac-header .ac-modes button {
  box-sizing: border-box; margin: 0; padding: var(--ac-space-1) var(--ac-space-2);
  min-height: 32px; width: auto; min-width: 0; border: 0; border-radius: calc(var(--ac-radius) - 2px);
  background: transparent; color: var(--ac-text); font: inherit; line-height: 1.4; cursor: pointer;
}
.ac-header .ac-modes button:hover { text-decoration: underline; }
.ac-header .ac-modes button[aria-pressed="true"] { background: var(--ac-primary); color: var(--ac-on-primary); }
dialog:is(#sample-gate, #sample-notice, #gate) {
  background: var(--ac-surface); color: var(--ac-text); border: 1px solid var(--ac-border);
  border-radius: var(--ac-radius); padding: var(--ac-space-5); font: 400 16px/1.6 var(--ac-font);
}
dialog:is(#sample-gate, #sample-notice, #gate)::backdrop { background: var(--ac-backdrop); }
dialog:is(#sample-gate, #sample-notice, #gate) :is(p, label, .gate-title, .gate-body) { color: var(--ac-text); }
dialog:is(#sample-gate, #sample-notice, #gate) button {
  min-width: 64px; min-height: 44px; padding: var(--ac-space-2) var(--ac-space-4);
  color: var(--ac-on-primary); background: var(--ac-primary); border: 0;
  border-radius: var(--ac-radius); font: 600 1rem/1.4 var(--ac-font);
}
dialog:is(#sample-gate, #sample-notice, #gate) button:hover { background: var(--ac-primary-hover); }
@media print { .ac-header .ac-actions { display: none; } }
</style>

<body>
<dialog id="sample-gate" lang="ja" aria-label="サンプル利用上の注意" aria-describedby="sample-gate-message">
  <p id="sample-gate-message">このツールはサンプル（コンセプト）です。計算・測定結果の正確性は保証できません。実務の判断には使用しないでください。</p>
  <form method="dialog"><button type="submit" autofocus>OK</button></form>
</dialog>
<script>
{
  const gate = document.getElementById('sample-gate');
  gate.addEventListener('cancel', event => event.preventDefault());
  gate.showModal();
}
</script>
<div class="wrap">
  <header class="ac-header"><h1>SlabFDTD — 四角板（同定つき・安定版）</h1>
    <div class="ac-actions" lang="ja">
      <a class="ac-home" href="index.html">ツール一覧</a>
      <div class="ac-modes" role="group" aria-label="表示テーマ">
        <button type="button" data-ac-mode="auto" aria-pressed="true" title="OSの配色に合わせる">自動</button>
        <button type="button" data-ac-mode="light" aria-pressed="false">ライト</button>
        <button type="button" data-ac-mode="dark" aria-pressed="false">ダーク</button>
      </div>
    </div>
  </header>
  <div class="grid">
    <div class="card" id="controlsPanel">
      <div class="preset-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
        <div style="background:var(--ac-surface-alt);padding:var(--ac-space-2);border-radius:var(--ac-radius);border:1px solid var(--ac-border)">
          <strong>材料プリセット</strong>
          <select id="material_preset" style="margin-top:6px">
            <option value="concrete">Concrete (E=2.6e10, ν=0.2, ρ=2300)</option>
            <option value="steel">Steel (E=2.1e11, ν=0.3, ρ=7850)</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div style="background:var(--ac-surface-alt);padding:var(--ac-space-2);border-radius:var(--ac-radius);border:1px solid var(--ac-border)">
          <strong>加振点プリセット</strong>
          <select id="sourcePreset_preset" style="margin-top:6px">
            <option value="center">中心 (Lx/2, Ly/2)</option>
            <option value="diag_1_3">対角 1/3 (Lx/3, Ly/3)</option>
            <option value="diag_2_3">対角 2/3 (2Lx/3, 2Ly/3)</option>
            <option value="custom">カスタム</option>
          </select>
        </div>
      </div>

      <div id="paramsArea">
        <div class="row controls-row">
          <div style="flex:1"><label>E [Pa]</label><input id="E" type="number" value="26000000000"></div>
          <div style="flex:1"><label>ν</label><input id="nu" type="number" step="0.01" value="0.20"></div>
        </div>
        <div class="row controls-row">
          <div style="flex:1"><label>ρ [kg/m³]</label><input id="rho" type="number" value="2300"></div>
          <div style="flex:1"><label>h [m]</label><input id="h" type="number" step="0.01" value="0.15"></div>
        </div>
        <div class="row controls-row">
          <div style="flex:1"><label>Lx [m]</label><input id="Lx" type="number" step="0.01" value="5.00"></div>
          <div style="flex:1"><label>Ly [m]</label><input id="Ly" type="number" step="0.01" value="4.00"></div>
        </div>
        <div class="row controls-row">
          <div style="flex:1"><label>Ngrid（長辺方向の格子点数）</label><input id="Ngrid" type="number" step="1" min="16" value="40"></div>
          <div style="flex:1"><label>dx (m) — overrides Ngrid if &gt;0</label><input id="dx" type="number" step="0.01" value="0.00"></div>
        </div>
        <div class="row controls-row">
          <div style="flex:1"><label>計算時間 [s]（周波数分解能 ≈ 1/計算時間）</label><input id="simDur" type="number" min="0.05" max="10" step="0.05" value="1.0"></div>
          <div style="flex:1"><label>f<sub>max,target</sub> [Hz]</label><input id="fmaxTarget" type="number" min="10" value="250"></div>
        </div>
        <div class="row controls-row">
          <div style="flex:1"><label>m_max</label><input id="mmax" type="number" min="1" max="64" value="8"></div>
          <div style="flex:1"><label>n_max</label><input id="nmax" type="number" min="1" max="64" value="8"></div>
        </div>

        <div class="row">
          <label>加振点（プリセットで選択、または「カスタム」で座標を入力）</label>
          <div class="controls-row">
            <div style="flex:1"><input id="x0" type="number" step="0.01" value="2.50"></div>
            <div style="flex:1"><input id="y0" type="number" step="0.01" value="2.00"></div>
          </div>
        </div>

        <div class="row inline">
          <span class="kv">2D 表示</span>
        </div>

        <div class="row">
          <button id="computeBtn" class="btn">計算開始</button>
          <button id="abortBtn" class="btn">中断</button>
          <button id="resetBtn" class="btn">リセット</button>
        </div>

        <div class="row">
          <label>Progress</label>
          <div class="progress"><div id="progressFill" style="width:0%"></div></div>
          <div id="progressText" class="kv"></div>
          <div id="resultStatus" class="kv" aria-live="polite"></div>
          <div id="errorBox"></div>
        </div>
      </div>

      <hr>
      <div class="row"><strong>Mode list</strong></div>
      <div class="mode-list" id="modeList"></div>
    </div>

    <div class="card">
      <div class="tabbar" role="tablist">
        <div class="tab active" data-tab="time">Time</div>
        <div class="tab" data-tab="mode">Mode</div>
        <div class="tab" data-tab="freq">Frequency</div>
      </div>

      <div id="timePanel" class="panel">
        <canvas id="heatCanvas" class="heat"></canvas>
        <div class="playback-controls" style="display:flex;gap:8px;margin-top:8px;align-items:center">
          <button id="timePlay" class="small-btn btn">Start</button>
          <button id="timeStop" class="small-btn">Stop</button>
          <button id="timePrev" class="small-btn">◀︎</button>
          <button id="timeNext" class="small-btn">▶︎</button>
          <label style="margin-left:8px" class="kv">FPS</label>
          <input id="fps" type="range" min="1" max="60" value="25" style="width:140px">
          <button id="recordBtn" class="small-btn btn" style="margin-left:auto" disabled>録画（利用不可）</button>
          <div id="recordStatus" class="kv" style="margin-left:8px"></div>
        </div>
        <input id="frameSlider" type="range" min="0" max="127" value="0" style="width:100%;margin-top:8px">
      </div>

      <div id="modePanel" class="panel" style="display:none">
        <div class="playback-controls" style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
          <button id="modeStart" class="btn">Start</button>
          <button id="modeStop" class="btn">Stop</button>
          <label style="margin-left:8px" class="kv">アニメフレーム</label>
          <input id="modeFrames" type="number" value="64" min="8" max="512" style="width:80px">
          <span class="badge">FRFピークをクリックでモード可視化</span>
        </div>
        <div class="mode-image">
          <canvas id="modeCanvas" class="modeCanvas"></canvas>
          <span class="mode-map-label">FDTD-based mode map (normalized)</span>
        </div>
      </div>

      <div id="freqPanel" class="panel" style="display:none">
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px">
          <label class="kv">表示：</label>
          <select id="frfType" style="width:auto">
            <option value="mobility">Mobility |Y| [m/s/N] (dB)</option>
            <option value="impedance">Impedance |Z| [N·s/m] (dB)</option>
          </select>
          <label class="kv"><input type="checkbox" id="showFDTD" checked> FDTD</label>
          <label class="kv"><input type="checkbox" id="showModal" checked> Modal(SS)</label>
          <label class="kv"><input type="checkbox" id="showInf" checked> Infinite plate</label>
          <button id="computeFRF" class="small-btn btn" style="margin-left:auto">FRF 計算/更新</button>
        </div>
        <div id="frfPlot"></div>
        <div id="peakList" class="kv" style="margin-top:8px"></div>
      </div>
    </div>
  </div>
</div>

<script>
(()=>{"use strict";
const $ = id => document.getElementById(id);
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function D_of(E,h,nu){ return E*h*h*h/(12*(1-nu*nu)); }
function phi(m,n,x,y,Lx,Ly){ return Math.sin(m*Math.PI*x/Lx)*Math.sin(n*Math.PI*y/Ly); }
function nextPow2(n){ let p=1; while(p<n) p*=2; return p; }
function hann(N){ const w=new Float64Array(N); for(let n=0;n<N;n++) w[n]=0.5*(1-Math.cos(2*Math.PI*n/(N-1))); return w; }
function showError(msg){ const el=$('errorBox'); el.style.display='block'; el.textContent='Error: '+msg; console.error(msg); }
window.addEventListener('error', e=>showError(e.message+' ('+e.filename+':'+e.lineno+')'));
window.addEventListener('unhandledrejection', e=>showError('UnhandledRejection: '+(e.reason?.message||String(e.reason))));

/* DPR canvas */
function resizeCanvasForDisplay(canvas, W, H){
  const r=window.devicePixelRatio||1;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  canvas.width=Math.max(1,Math.round(W*r)); canvas.height=Math.max(1,Math.round(H*r));
  const ctx=canvas.getContext('2d'); ctx.setTransform(r,0,0,r,0,0); return ctx;
}
function drawArrayToCanvas(arr,Nx,Ny,ctx,manualMin,manualMax){
  const W=parseFloat(ctx.canvas.style.width)||ctx.canvas.width, H=parseFloat(ctx.canvas.style.height)||ctx.canvas.height;
  let mn=manualMin, mx=manualMax;
  if(!isFinite(mn)||!isFinite(mx)){ mn=Infinity; mx=-Infinity; for(const v of arr){ if(v<mn) mn=v; if(v>mx) mx=v; } if(!isFinite(mn)){ mn=0; mx=1; } }
  const img=new ImageData(Nx,Ny); const span=(mx-mn)||1e-12;
  for(let j=0;j<Ny;j++)for(let i=0;i<Nx;i++){ const v=arr[j*Nx+i], t=Math.max(0,Math.min(1,(v-mn)/span));
    const p=(j*Nx+i)*4; img.data[p]=Math.round(68+187*t); img.data[p+1]=Math.round(1+185*t); img.data[p+2]=Math.round(84+40*(1-t)); img.data[p+3]=255; }
  const tmp=document.createElement('canvas'); tmp.width=Nx; tmp.height=Ny; tmp.getContext('2d').putImageData(img,0,0);
  ctx.clearRect(0,0,W,H); ctx.drawImage(tmp,0,0,W,H);
}

/* sizing */
function currentDisplaySize(){
  const card=document.querySelector('.card:last-child'); const W=card.clientWidth-24;
  const {Lx,Ly}=lastResult || initialPlate;
  const H=Math.max(200,Math.min(900,Math.round(W*(Ly/Lx))));
  return {W,H};
}

/* state */
let lastResult=null, activeRun=null, worker=null, runNumber=0;
let currentFrame=0;
let playTimer=null;            // ← 再生タイマー（宣言はここ1か所のみ）
let currentMode=null, modeAnimId=null, modeImage=null;
let initialPlate;
const frameSliderMax=$('frameSlider').max;
const conditionInputs=Array.from(document.querySelectorAll('#controlsPanel input, #controlsPanel select'));
function inputSignature(){ return JSON.stringify(conditionInputs.map(el=>el.value)); }
function updateResultStatus(){
  const changed=lastResult && lastResult.inputs!==inputSignature();
  $('resultStatus').textContent=lastResult
    ? `表示中：計算 ${lastResult.id}${changed?'（条件変更・再計算待ち）':''}` : '';
}
conditionInputs.forEach(el=>{
  el.addEventListener('input',updateResultStatus);
  el.addEventListener('change',updateResultStatus);
});

/* modes */
function buildModes(Lx,Ly,E,nu,rho,h,mmax,nmax){
  const D=D_of(E,h,nu);
  const arr=[];
  for(let m=1;m<=mmax;m++) for(let n=1;n<=nmax;n++){
    const k2=Math.pow(m*Math.PI/Lx,2)+Math.pow(n*Math.PI/Ly,2);
    const omega=Math.sqrt(D/(rho*h))*k2; arr.push({m,n,omega,f:omega/(2*Math.PI)});
  }
  arr.sort((a,b)=>a.f-b.f); return arr;
}
function populateModeList(modes){
  const div=$('modeList'); div.innerHTML='';
  modes.forEach((md,idx)=>{
    const el=document.createElement('div'); el.style.padding='6px'; el.style.borderBottom='1px solid #f1f5f9'; el.style.cursor='pointer';
    el.textContent=`#${idx+1} (m,n)=(${md.m},${md.n}) f=${md.f.toFixed(2)} Hz`;
    el.onclick=()=>{ Array.from(div.children).forEach(x=>x.style.background=''); el.style.background='#eef6ff';
      selectMode(md); };
    div.appendChild(el);
  });
}

/* 壊れにくい Worker 起動 */
async function spawnWorker(scriptPath){
  try{ return new Worker(scriptPath); }
  catch(e1){
    const res=await fetch(scriptPath,{cache:'no-store'});
    if(!res.ok) throw new Error(`HTTP ${res.status} for ${scriptPath}`);
    const code=await res.text();
    const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
    return new Worker(url);
  }
}
function cancelRun(){
  activeRun=null;
  if(worker) worker.terminate();
  worker=null;
}
async function startWorker(cfg,modes){
  cancelRun();
  const run={id:++runNumber, cfg, modes, inputs:inputSignature()};
  activeRun=run;
  updateResultStatus();
  function fail(message){
    if(activeRun!==run) return;
    cancelRun(); $('progressText').textContent='計算失敗'; showError(message);
  }
  try{
    const started=await spawnWorker('Fdtdworker.js');
    if(activeRun!==run){ started.terminate(); return; }
    worker=started;
    worker.onerror=e=>fail('Worker error: '+(e?.message||String(e)));
    worker.onmessage=(ev)=>{
      if(activeRun!==run) return;
      const msg=ev.data;
      if(msg.type==='progress'){
        $('progressFill').style.width=msg.progress+'%';
        $('progressText').textContent=msg.msg|| (msg.progress+'%');
      }else if(msg.type==='done'){
        const r=msg.result;
        const frames=r.framesBuf.map(buf=>new Float32Array(buf));
        cancelRun();
        stopPlayback(); stopModeAnimation();
        lastResult={...run, frames, Nx:r.Nx, Ny:r.Ny, dt:r.dt, Fs:r.Fs, dx:r.dx, dy:r.dy, Lx:r.Lx, Ly:r.Ly};
        currentFrame=0; currentMode=null; modeImage=null;
        populateModeList(modes);
        $('progressFill').style.width='100%';
        $('progressText').textContent=`計算 ${run.id} 完了：${r.Nx}×${r.Ny} 格子、保存 ${frames.length} フレーム（Fs=${r.Fs.toFixed(0)} Hz、Δf≈${(r.Fs/frames.length).toFixed(2)} Hz）`;
        updateResultStatus(); renderFrame(0); computeAndPlotFRF();
        if(document.querySelector('.tab.active').dataset.tab==='mode') showModeView();
      }
    };
    worker.postMessage({type:'start', cfg:{...cfg, modesLight:modes.slice(0,64)}});
  }catch(e){ fail('Fdtdworker.js を開始できませんでした: '+(e?.message||String(e))); }
}

/* compute */
$('computeBtn').addEventListener('click', ()=>{
  try{
    if($('material_preset').value==='concrete'){
      for(const id of ['E','nu','rho']) $(id).value=$(id).defaultValue;
    } else if($('material_preset').value==='steel'){ $('E').value=210000000000; $('nu').value=0.3; $('rho').value=7850; }

    const E=parseFloat($('E').value), nu=parseFloat($('nu').value), rho=parseFloat($('rho').value), h=parseFloat($('h').value);
    const Lx=parseFloat($('Lx').value), Ly=parseFloat($('Ly').value);
    let Ngrid=parseInt($('Ngrid').value); const dx_in=parseFloat($('dx').value)||0;
    if(dx_in>0){ Ngrid=Math.ceil(Math.max(Lx,Ly)/dx_in)+1; Ngrid=Math.max(16,Ngrid); }
    const simDur=Math.max(0.05, parseFloat($('simDur').value)||1.0);
    const fmaxTarget=Math.max(10, parseFloat($('fmaxTarget').value)||250);
    const mmax=parseInt($('mmax').value), nmax=parseInt($('nmax').value);

    const preset=$('sourcePreset_preset').value;
    if(preset==='center'){ $('x0').value=(Lx/2).toFixed(3); $('y0').value=(Ly/2).toFixed(3); }
    else if(preset==='diag_1_3'){ $('x0').value=(Lx/3).toFixed(3); $('y0').value=(Ly/3).toFixed(3); }
    else if(preset==='diag_2_3'){ $('x0').value=(2*Lx/3).toFixed(3); $('y0').value=(2*Ly/3).toFixed(3); }
    const x0=clamp(parseFloat($('x0').value),0,Lx), y0=clamp(parseFloat($('y0').value),0,Ly);

    const modes=buildModes(Lx,Ly,E,nu,rho,h,mmax,nmax);

    const D=D_of(E,h,nu), marea=rho*h;
    // Grid: Ngrid points along the longer side; Nx, Ny chosen so that the plate is exactly Lx × Ly.
    const step0=Math.max(Lx,Ly)/(Ngrid-1);
    const Nx=Math.max(4,Math.round(Lx/step0)+1), Ny=Math.max(4,Math.round(Ly/step0)+1);
    const dx=Lx/(Nx-1), dy=Ly/(Ny-1), dmin=Math.min(dx,dy);
    // Leapfrog stability for the biharmonic operator: dt ≤ dmin²/4·√(m/D); 0.2 leaves a margin.
    const Cstab=0.2;
    const dt_stab=Cstab*dmin*dmin*Math.sqrt(marea/(D||1e-30));
    const dt_res=1.0/(20*Math.max(1,fmaxTarget));
    const dt=Math.min(dt_stab, dt_res);
    const steps=Math.ceil(simDur/dt);
    const saveEvery=Math.max(1, Math.floor(1/(8*fmaxTarget*dt)));   // stored frames at ≈ 8·fmax
    const nFrames=Math.floor(steps/saveEvery);
    if(nFrames*Nx*Ny*4 > 400e6) throw new Error(`保存データが大きすぎます（${(nFrames*Nx*Ny*4/1e6).toFixed(0)} MB）。計算時間か Ngrid を小さくしてください。`);

    $('progressFill').style.width='0%'; $('progressText').textContent=`計算中…（${Nx}×${Ny} 格子、${steps.toLocaleString()} ステップ、保存 ${nFrames} フレーム）`;

    startWorker({E,nu,rho,h,Lx,Ly,Nx,Ny,dx,dy,dt,steps,saveEvery,x0,y0,Ngrid,simDur,fmaxTarget,mmax,nmax},modes);
  }catch(err){ showError('compute start failed: '+(err?.message||String(err))); }
});
$('abortBtn').onclick=()=>{ cancelRun(); $('progressFill').style.width='0%'; $('progressText').textContent='キャンセル済み'; };

/* Time view */
function renderFrame(i){
  const cvs=$('heatCanvas'); const {W,H}=currentDisplaySize(); const ctx=resizeCanvasForDisplay(cvs,W,H);
  if(!lastResult){ ctx.clearRect(0,0,W,H); return; }
  const Nx=lastResult.Nx, Ny=lastResult.Ny; i=Math.max(0,Math.min(i,lastResult.frames.length-1));
  drawArrayToCanvas(lastResult.frames[i],Nx,Ny,ctx); $('frameSlider').max=lastResult.frames.length-1; $('frameSlider').value=i;
}
$('frameSlider').addEventListener('input', e=>{ currentFrame=parseInt(e.target.value); renderFrame(currentFrame); });
$('timePlay').addEventListener('click', ()=>{ if(!lastResult){ alert('まず計算してください'); return; } if(playTimer) clearInterval(playTimer);
  const fps=parseInt($('fps').value)||25; playTimer=setInterval(()=>{ currentFrame=(currentFrame+1)%lastResult.frames.length; renderFrame(currentFrame); }, 1000/Math.max(1,fps)); });
function stopPlayback(){ if(playTimer!==null) clearInterval(playTimer); playTimer=null; }
$('timeStop').addEventListener('click',stopPlayback);
$('timePrev').addEventListener('click', ()=>{ if(!lastResult) return; currentFrame=Math.max(0,currentFrame-1); renderFrame(currentFrame); });
$('timeNext').addEventListener('click', ()=>{ if(!lastResult) return; currentFrame=Math.min(lastResult.frames.length-1,currentFrame+1); renderFrame(currentFrame); });

/* Mode view */
function selectMode(mode){
  currentMode=mode;
  document.querySelector('.tab[data-tab="mode"]').click();
}
function sizeModeCanvas(){
  const {W,H}=currentDisplaySize();
  return resizeCanvasForDisplay($('modeCanvas'),W,H);
}
function redrawModeImage(){
  const ctx=sizeModeCanvas();
  if(!modeImage) return;
  const {Nx,Ny}=lastResult || initialPlate;
  if(currentMode) drawArrayToCanvas(modeImage,Nx,Ny,ctx);
  else{
    drawArrayToCanvas(modeImage,Nx,Ny,ctx,0,1);
    ctx.fillStyle='#0f172a'; ctx.fillText('FDTD-based mode map (normalized)',12,12);
  }
}
function startModeAnimation(mode){
  stopModeAnimation();
  currentMode=mode;
  const ctx=sizeModeCanvas();
  const {Nx,Ny,Lx,Ly}=lastResult || initialPlate;
  const xs=new Array(Nx), ys=new Array(Ny);
  for(let i=0;i<Nx;i++) xs[i]=Lx*i/(Nx-1); for(let j=0;j<Ny;j++) ys[j]=Ly*j/(Ny-1);
  const phiArr=new Float64Array(Nx*Ny); let maxabs=0;
  for(let j=0;j<Ny;j++) for(let i=0;i<Nx;i++){ const v=Math.sin(mode.m*Math.PI*xs[i]/Lx)*Math.sin(mode.n*Math.PI*ys[j]/Ly); phiArr[j*Nx+i]=v; if(Math.abs(v)>maxabs) maxabs=Math.abs(v); }
  if(maxabs===0) maxabs=1; for(let k=0;k<phiArr.length;k++) phiArr[k]/=maxabs;
  const framesLocal=parseInt($('modeFrames').value)||64; let f=0;
  modeImage=new Float32Array(Nx*Ny);
  function step(){ const t=f/framesLocal, cs=Math.cos(2*Math.PI*t);
    for(let k=0;k<phiArr.length;k++) modeImage[k]=phiArr[k]*cs;
    drawArrayToCanvas(modeImage,Nx,Ny,ctx); f=(f+1)%framesLocal; modeAnimId=requestAnimationFrame(step); }
  $('modeStart').disabled=false; $('modeStop').disabled=false;
  step();
}
function stopModeAnimation(){
  if(modeAnimId!==null) cancelAnimationFrame(modeAnimId);
  modeAnimId=null;
  $('modeStop').disabled=true;
}
function showModeView(){
  if(!currentMode && modeImage){ redrawModeImage(); return; } // FFT peak stays a still image.
  const mode=currentMode || (lastResult || initialPlate).modes[0];
  if(mode) startModeAnimation(mode); else redrawModeImage();
}
$('modeStart').onclick=showModeView;
$('modeStop').onclick=stopModeAnimation;
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
  const tab=t.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
  $('timePanel').style.display=tab==='time'?'':'none';
  $('modePanel').style.display=tab==='mode'?'':'none';
  $('freqPanel').style.display=tab==='freq'?'':'none';
  if(tab==='mode') showModeView(); else stopModeAnimation();
}));

/* FRF */
function derivativeCentered(vals,dt){
  const T=vals.length, v=new Float64Array(T);
  for(let t=0;t<T;t++){ if(t===0) v[t]=(vals[1]-vals[0])/dt; else if(t===T-1) v[t]=(vals[T-1]-vals[T-2])/dt; else v[t]=(vals[t+1]-vals[t-1])/(2*dt); }
  return v;
}
function mobility_modal_SS(freqs, modes, x0,y0, Lx,Ly, rho,h, eta){
  const C=4/(rho*h*Lx*Ly); const out=new Float64Array(freqs.length);
  for(let k=0;k<freqs.length;k++){ const w=2*Math.PI*freqs[k]; let Hr=0,Hi=0;
    for(const md of modes){ const phi0=phi(md.m,md.n,x0,y0,Lx,Ly); const omg2=md.omega*md.omega; const denR=omg2-w*w, denI=eta*omg2; const d=denR*denR+denI*denI||1e-30;
      const fracR=denR/d, fracI=-denI/d; Hr += (phi0*phi0)*fracR; Hi += (phi0*phi0)*fracI; }
    const Yr = - w * (C*Hi), Yi = w * (C*Hr); out[k]=Math.hypot(Yr,Yi);
  } return out;
}
function mobility_infinite_const(D,rho,h){ return 1/(8*Math.sqrt(D*rho*h)); }

function computeAndPlotFRF(){
  const result=lastResult;
  if(!result) return;
  const frfType=$('frfType').value; const showFDTD=$('showFDTD').checked, showModal=$('showModal').checked, showInf=$('showInf').checked;
  const {E,nu,rho,h,Lx,Ly,x0,y0}=result.cfg, D=D_of(E,h,nu);
  const {frames,dt,Fs,Nx,Ny,modes}=result, T=frames.length;
  // Read the same interior source cell to which the worker applied the force.
  const ix=clamp(Math.round(x0/Lx*(Nx-1)),1,Nx-2), iy=clamp(Math.round(y0/Ly*(Ny-1)),1,Ny-2);
  const wsrc=new Float64Array(T); for(let t=0;t<T;t++) wsrc[t]=frames[t][iy*Nx+ix];
  const vsrc=derivativeCentered(wsrc,dt);
  const forceSteps=Math.max(1, Math.floor(Fs*0.002));
  const F=new Float64Array(T); for(let n=0;n<Math.min(T,forceSteps);n++) F[n]=1.0;

  const win=hann(T); const Nfft=nextPow2(Math.max(512,T*4)); const K=Nfft/2;
  const freqs=new Float64Array(K); for(let k=0;k<K;k++) freqs[k]=k*Fs/Nfft;
  function dftMag(x){ const r=new Float64Array(K), im=new Float64Array(K); for(let k=0;k<K;k++){ let a=0,b=0; for(let n=0;n<T;n++){ const ang=-2*Math.PI*k*n/Nfft; const xn=x[n]*win[n]; a+=xn*Math.cos(ang); b+=xn*Math.sin(ang);} r[k]=a; im[k]=b;} const m=new Float64Array(K); for(let k=0;k<K;k++) m[k]=Math.hypot(r[k],im[k])/T; return m; }
  const V=dftMag(vsrc), FF=dftMag(F);
  const Yfdtd=new Float64Array(K); for(let k=0;k<K;k++) Yfdtd[k]= V[k] / Math.max(FF[k],1e-18);

  const eta=0.02;
  const Ymodal=mobility_modal_SS(freqs, modes, x0,y0, Lx,Ly, rho,h, eta);
  const Yinfc=mobility_infinite_const(D,rho,h);
  const Yinfl=new Float64Array(K); const Zinfl=new Float64Array(K); for(let k=0;k<K;k++){ Yinfl[k]=Yinfc; Zinfl[k]=1/Math.max(Yinfc,1e-30); }
  const inv = a => { const out=new Float64Array(a.length); for(let i=0;i<a.length;i++) out[i]=(a[i]>0)?1/a[i]:0; return out; };
  const toDb = a => Array.from(a, v=>20*Math.log10(Math.max(v,1e-20)));
  const traces=[];
  if(frfType==='mobility'){
    if(showFDTD) traces.push({x:Array.from(freqs), y:toDb(Yfdtd), name:'FDTD |Y|', type:'scatter', mode:'lines'});
    if(showModal) traces.push({x:Array.from(freqs), y:toDb(Ymodal), name:'Modal(SS, η) |Y|', type:'scatter', mode:'lines'});
    if(showInf) traces.push({x:Array.from(freqs), y:toDb(Yinfl), name:'Infinite plate |Y|', type:'scatter', mode:'lines', line:{dash:'dot'}});
  }else{
    if(showFDTD) traces.push({x:Array.from(freqs), y:toDb(inv(Yfdtd)), name:'FDTD |Z|', type:'scatter', mode:'lines'});
    if(showModal) traces.push({x:Array.from(freqs), y:toDb(inv(Ymodal)), name:'Modal(SS, η) |Z|', type:'scatter', mode:'lines'});
    if(showInf) traces.push({x:Array.from(freqs), y:toDb(Zinfl), name:'Infinite plate |Z|', type:'scatter', mode:'lines', line:{dash:'dot'}});
  }

  /* 星（解析モード） */
  let ymax=-1e9; for(const tr of traces){ for(const y of tr.y) if(isFinite(y)&&y>ymax) ymax=y; }
  const starY=ymax+6, starX=[], starText=[];
  for(const m of modes){ const f=m.f; if(f>0 && f<freqs[K-1]){ starX.push(f); starText.push(`(${m.m},${m.n}) ${f.toFixed(2)} Hz`);} }
  traces.push({x:starX,y:new Array(starX.length).fill(starY),text:starText,name:'Modes',mode:'markers+text',marker:{symbol:'star',size:10},textposition:'top center',hoverinfo:'text'});

  const layout={xaxis:{type:'log',title:'Frequency [Hz]'}, yaxis:{title:(frfType==='mobility'?'|Y| [dB re 1 m/s/N]':'|Z| [dB re 1 N·s/m]')}, margin:{t:20,b:50,l:60,r:10}, legend:{orientation:'h'}};
  Plotly.newPlot('frfPlot',traces,layout,{responsive:true,displaylogo:false}).then(gd=>{
    if(result!==lastResult) return;
    gd.removeAllListeners?.('plotly_click'); // 念のため掃除
    gd.on('plotly_click', ev=>{
      const pt=ev.points?.[0]; if(!pt || result!==lastResult) return;
      const trname=gd.data[pt.curveNumber]?.name;
      if(trname==='Modes'){ // 解析モード星クリック
        const m=pt.text.match(/\((\d+),(\d+)\)/); if(m){ const mm=+m[1], nn=+m[2]; const md=modes.find(x=>x.m===mm && x.n===nn);
          if(md) selectMode(md); }
      }
    });
  });

  /* Peaks: FDTD → (m,n) へマッチ（±3%） */
  const peakDiv=$('peakList'); peakDiv.innerHTML='<strong>Peaks (FDTD)</strong><br>';
  const baseMag=(frfType==='mobility')? Yfdtd : inv(Yfdtd);
  const thr=Math.max(...baseMag)*0.20; const peaks=[];
  for(let k=2;k<baseMag.length-2;k++){ if(baseMag[k]>baseMag[k-1] && baseMag[k]>baseMag[k+1] && baseMag[k]>thr) peaks.push(k); }
  const tol=0.03;
  peaks.slice(0,16).forEach(k=>{
    const f=freqs[k];
    let match=null,errMin=Infinity;
    for(const md of modes){ const e=Math.abs(md.f - f)/md.f; if(e<errMin){ errMin=e; match=md; } }
    const matched = (match && errMin<=tol);
    const btn=document.createElement('button');
    btn.textContent = matched ? `${f.toFixed(2)} Hz → (${match.m},${match.n})` : `${f.toFixed(2)} Hz → (?)`;
    btn.className='small-btn';
    btn.addEventListener('click', ()=>{
      if(result!==lastResult) return;
      if(matched) selectMode(match); else showModeMapFromFFT(result,k,Nfft);
    });
    peakDiv.appendChild(btn); peakDiv.appendChild(document.createTextNode(' '));
  });
}

/* FDTD→空間FFTモード図（未一致フォールバック） */
function showModeMapFromFFT(result,idx,Nfft){
  stopModeAnimation();
  const {frames,Nx,Ny}=result, T=frames.length;
  const re=new Float64Array(Nx*Ny), im=new Float64Array(Nx*Ny);
  for(let j=0;j<Ny;j++)for(let i=0;i<Nx;i++){ let R=0,I=0; for(let t=0;t<T;t++){ const v=frames[t][j*Nx+i]; const a=-2*Math.PI*idx*t/Nfft; R+=v*Math.cos(a); I+=v*Math.sin(a);} const id=j*Nx+i; re[id]=R; im[id]=I; }
  let mx=0; const amp=new Float64Array(Nx*Ny); for(let k=0;k<amp.length;k++){ amp[k]=Math.hypot(re[k],im[k]); if(amp[k]>mx) mx=amp[k]; }
  if(mx===0) mx=1; for(let k=0;k<amp.length;k++) amp[k]/=mx;
  currentMode=null; modeImage=amp;
  $('modeStart').disabled=true;
  document.querySelector('.tab[data-tab="mode"]').click();
}

/* FRF UI */
$('computeFRF').addEventListener('click', computeAndPlotFRF);
['frfType','showFDTD','showModal','showInf'].forEach(id=>$(id).addEventListener('change', computeAndPlotFRF));

/* Initial mode preview and reset */
function initializeViews(){
  const E=parseFloat($('E').value), nu=parseFloat($('nu').value), rho=parseFloat($('rho').value), h=parseFloat($('h').value);
  const Lx=parseFloat($('Lx').value), Ly=parseFloat($('Ly').value);
  const Nx=parseInt($('Ngrid').value), Ny=Math.max(4,Math.round(Nx*Ly/Math.max(Lx,Ly)));
  initialPlate={Lx,Ly,Nx,Ny,modes:buildModes(Lx,Ly,E,nu,rho,h,parseInt($('mmax').value),parseInt($('nmax').value))};
  populateModeList(initialPlate.modes);
  renderFrame(0);
  $('modeStart').disabled=false; $('modeStop').disabled=true;
}
$('resetBtn').onclick=()=>{
  cancelRun(); stopPlayback(); stopModeAnimation();
  lastResult=null; currentFrame=0; currentMode=null; modeImage=null; runNumber=0;
  $('frameSlider').max=frameSliderMax;
  document.querySelectorAll('input').forEach(el=>{
    if(el.type==='checkbox') el.checked=el.defaultChecked; else el.value=el.defaultValue;
  });
  document.querySelectorAll('select').forEach(el=>el.selectedIndex=0);
  $('progressFill').style.width='0%'; $('progressText').textContent='';
  $('errorBox').style.display='none'; $('errorBox').textContent='';
  if($('frfPlot').data) Plotly.purge('frfPlot');
  $('peakList').textContent='';
  document.querySelector('.tab[data-tab="time"]').click();
  initializeViews(); redrawModeImage(); updateResultStatus();
};
initializeViews();
window.addEventListener('resize', ()=>{
  renderFrame(currentFrame);
  if(document.querySelector('.tab.active')?.dataset.tab==='mode') redrawModeImage();
});

})();</script>
